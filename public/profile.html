<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>My Profile | SkillSwap</title>
  <link rel="stylesheet" href="/allcss/profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="profile-container">
    <div class="profile-header">
      <div class="profile-pic-container">
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Default Profile" class="profile-pic">
      </div>
      <div class="profile-info">
        <h1 class="user-name">[User Name]</h1>
        <p class="user-email"><i class="fas fa-envelope"></i> [User Email]</p>
      </div>
    </div>

    <div class="profile-content">
      <!-- For Students -->
      <div class="student-section">
        <section class="profile-section">
          <h2 class="section-title"><i class="fas fa-star"></i> Favourite Skills</h2>
          <div class="skills-container">
            <!-- Favourite skills will be loaded here -->
          </div>
        </section>

        <section class="profile-section">
          <h2 class="section-title"><i class="fas fa-calendar-check"></i> My Sessions</h2>
          <div class="session-list">
            <div class="session-item">
              <div class="session-info">
                <div class="session-detail">
                  <i class="fas fa-book"></i>
                  <span><strong>Skill:</strong> Baking</span>
                </div>
                <div class="session-detail">
                  <i class="fas fa-user-tie"></i>
                  <span><strong>Expert:</strong> John Doe</span>
                </div>
                <div class="session-detail">
                  <i class="fas fa-info-circle"></i>
                  <span><strong>Status:</strong> <span class="status-accepted">Accepted</span></span>
                </div>
              </div>
              <div class="session-actions">
                <button class="btn chat-btn">
                  <i class="fas fa-comments"></i> Chat
                </button>
                <button class="btn complete-btn">
                  <i class="fas fa-check-circle"></i> Mark Completed
                </button>
              </div>
            </div>
            
            <!-- Example of a completed session -->
            <div class="session-item completed">
              <div class="session-info">
                <div class="session-detail">
                  <i class="fas fa-book"></i>
                  <span><strong>Skill:</strong> Photography</span>
                </div>
                <div class="session-detail">
                  <i class="fas fa-user-tie"></i>
                  <span><strong>Expert:</strong> Jane Smith</span>
                </div>
                <div class="session-detail">
                  <i class="fas fa-info-circle"></i>
                  <span><strong>Status:</strong> <span class="status-completed">Completed</span></span>
                </div>
              </div>
              <div class="session-actions">
                <button class="btn chat-btn" disabled>
                  <i class="fas fa-comments"></i> Chat
                </button>
                <button class="btn complete-btn" disabled>
                  <i class="fas fa-check-circle"></i> Completed
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="action-buttons">
        <a href="home.html" class="btn back-btn">
          <i class="fas fa-arrow-left"></i> Back to Home
        </a>
      </div>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div id="feedback-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Session Feedback</h3>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="feedback-form">
          <input type="hidden" id="feedback-session-id">
          <div class="form-group">
            <label for="feedback-rating">Rating:</label>
            <div id="feedback-stars" class="star-rating">
              <span data-value="1">&#9733;</span>
              <span data-value="2">&#9733;</span>
              <span data-value="3">&#9733;</span>
              <span data-value="4">&#9733;</span>
              <span data-value="5">&#9733;</span>
            </div>
          </div>
          <div class="form-group">
            <label for="feedback-comments">Comments:</label>
            <textarea id="feedback-comments" rows="4" required></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn secondary-btn close-modal">Cancel</button>
            <button type="submit" class="btn primary-btn">Submit Feedback</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/alljs/profile.js"></script>
</body>
</html>
